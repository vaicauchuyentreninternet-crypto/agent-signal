name: daily-refresh

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 ICT (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_trends.py

      - name: Commit refreshed data
        run: |
          git config user.name "agent-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/trends.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily trend refresh ($(date -u +%F))"
            git push
          else
            echo "no data changes"
          fi
